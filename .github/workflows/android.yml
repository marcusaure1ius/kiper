# Android: domain unit tests + debug build (JDK 17, Android SDK preinstalled on ubuntu images).
name: android

on:
  push:
    branches: [main]
    paths: ["android-native/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android-native/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4 # dependency + wrapper caching

      - name: Run unit tests
        working-directory: android-native
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android-native
        run: ./gradlew :app:assembleDebug

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android-native/app/build/reports/tests/
          retention-days: 7
